name: Sync AGENTS.md from CLAUDE.md

on:
  push:
    paths: [CLAUDE.md]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: cp CLAUDE.md AGENTS.md
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: sync AGENTS.md from CLAUDE.md"
          file_pattern: AGENTS.md
